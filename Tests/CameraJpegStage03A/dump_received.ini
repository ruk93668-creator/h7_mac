// Debugger-side read only. Keep CM7 halted; do not RESET or restart capture.
// Current received length: 0x450 bytes from SDRAM address 0xD0000400.
FUNC void DumpStage03Jpeg(void) {
    unsigned long i;
    printf("JPEG_DATA_BEGIN\n");
    for (i = 0; i < 0x450; i++) {
        if ((i & 15) == 0) {
            printf("JPG%08X:", i);
        }
        printf("%02X", _RBYTE(0xD0000400 + i));
        if ((i & 15) == 15 || i == 0x44F) {
            printf("\n");
        }
    }
    printf("JPEG_DATA_END\n");
}

LOG > jpeg_received_bytes.txt
DumpStage03Jpeg()
LOG OFF
