// Keep CM7 halted after state=2. Export the current validated JPEG only.
FUNC void DumpStage03Ready(unsigned long bytes) {
    unsigned long i;
    if (bytes == 0 || bytes > 262140) {
        printf("Invalid JPEG size\n");
        return;
    }
    printf("JPEG_DATA_BEGIN\n");
    for (i = 0; i < bytes; i++) {
        if ((i & 15) == 0) printf("JPG%08X:", i);
        printf("%02X", _RBYTE(0xD0000400 + i));
        if ((i & 15) == 15 || i + 1 == bytes) printf("\n");
    }
    printf("JPEG_DATA_END\n");
}
LOG > jpeg_ready_bytes.txt
DumpStage03Ready(g_camera_jpeg_test.size_bytes)
LOG OFF
